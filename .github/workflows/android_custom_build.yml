name: Build Dolphin Android

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code et des sous-modules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configuration de Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installation du NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;28.0.13004108"

      - name: Configuration de Gradle & Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Compilation de l'APK
        working-directory: Source/Android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Signer l'APK avec apksigner
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > release.keystore
          APK_FILE=$(find Source/Android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks release.keystore \
            --ks-key-alias "${{ secrets.ALIAS }}" \
            --ks-pass pass:"${{ secrets.KEY_STORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            "$APK_FILE"
          rm release.keystore

      - name: Exportation du fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: Dolphin-Android-APK
          path: Source/Android/app/build/outputs/apk/release/*.apk

